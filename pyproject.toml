[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibleql"
dynamic = ["version"]
description = "Python client for the BibleQL GraphQL API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luis Porras", email = "lporras16@gmail.com" }]
keywords = ["bible", "graphql", "api", "client", "bibleql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.6",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/lporras/bibleql-python"
Source = "https://github.com/lporras/bibleql-python"
Changelog = "https://github.com/lporras/bibleql-python/blob/main/CHANGELOG.md"

# Read the version from __version__ in __init__.py (like version.rb)
[tool.hatch.version]
path = "src/bibleql/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F = pycodestyle/pyflakes, I = import sorting, UP = modern syntax, B = common bugs
select = ["E", "F", "I", "UP", "B"]
